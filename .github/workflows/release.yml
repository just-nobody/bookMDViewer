name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4[cite: 4]

      - name: Setup Node
        uses: actions/setup-node@v4[cite: 4]
        with:
          node-version: lts/*[cite: 4]

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable[cite: 4]

      - name: Rust cache
        uses: swatinem/rust-cache@v2[cite: 4]
        with:
          workspaces: "./src-tauri -> target"[cite: 4]

      - name: Install frontend dependencies
        run: npm install[cite: 4]

      # Kompiliuojame tik patį projektą nenaudojant installerių generavimo
      - name: Build Tauri app binary
        run: npm run tauri build -- --no-bundle

      - name: Create Release and Upload Portable Executable
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Jei leidi rankiniu būdu (workflow_dispatch) be tag'o, panaudojame numatytąją versiją
          if [ -z "$VER" ]; then VER="portable"; fi
          
          OUT="Markdown.Viewer_${VER}_x64_portable.exe"
          
          # Nukopijuojame gryną .exe failą iš release katalogo
          cp "src-tauri/target/release/md-viewer.exe" "$OUT"
          
          # Sukuriame Release ir įkeliame TIK portable .exe failą
          gh release create "${GITHUB_REF_NAME:-v1.0.0}" "$OUT" \
            --title "Markdown Viewer ${GITHUB_REF_NAME:-Portable}" \
            --notes "Standalone portable Windows executable." \
            --clobber
