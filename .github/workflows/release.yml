name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # Sukompiliuojame programą
      - name: Build Tauri App
        run: npm run tauri build

      # Sukuriame Release ir įkeliame TIK VIENĄ failą markdown-viewer.exe
      - name: Create Release and Upload Single EXE
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Jei yra tag'as, naudojame jį, jei paleista rankiniu būdu – paimame versiją iš projekto žymos
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="latest"
          fi

          # Nukopijuojame sukompiliuotą failą tiksliu pavadinimu
          cp "src-tauri/target/release/md-viewer.exe" "markdown-viewer.exe"

          # Sukuriame Release (arba perrašome) ir įkeliame TIK šį vieną failą
          gh release create "$TAG_NAME" "markdown-viewer.exe" \
            --title "Markdown Viewer" \
            --notes "Standalone portable Windows executable." \
            --clobber
