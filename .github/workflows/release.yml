name: release

# Builds ONE portable Windows exe (markdown-viewer.exe) — no installers, no
# other operating systems.
#
#  - Push a tag like `v1.5.0`: builds the exe and attaches it to a GitHub
#    Release with that tag (the release is created if it doesn't exist).
#  - Run manually (Actions tab → release → Run workflow): builds only; download
#    the exe from the run's "Artifacts" section.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Runs `npm run build` (beforeBuildCommand) and then `cargo build --release`.
      # --no-bundle: only the exe, no NSIS/MSI installers.
      - name: Build portable exe
        run: npx tauri build --no-bundle

      - name: Rename exe
        shell: bash
        run: |
          EXE="src-tauri/target/release/md-viewer.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::$EXE not found"
            ls -la src-tauri/target/release
            exit 1
          fi
          cp "$EXE" markdown-viewer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer
          path: markdown-viewer.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" markdown-viewer.exe --clobber
          else
            gh release create "$TAG" markdown-viewer.exe \
              --title "Markdown Viewer $TAG" \
              --notes "Portable Windows build: download markdown-viewer.exe and run it (no installer). Requires the Microsoft Edge WebView2 Runtime."
          fi
