name: release

# Builds ONE portable Windows exe (markdown-viewer.exe) and publishes it as a
# GitHub Release — no installers, no zip, no other operating systems.
#
#  - Run manually (Actions tab → release → Run workflow): creates the release
#    `v<version>` (version from src-tauri/tauri.conf.json, e.g. v1.5.0) and
#    attaches markdown-viewer.exe. Re-running replaces the exe in that release.
#  - Pushing a tag like `v1.5.0` does the same for that tag (the tag must match
#    the app version).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Determine release tag
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version" | tr -d '\r')
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $TAG (src-tauri/tauri.conf.json)"
            exit 1
          fi
          echo "Release tag: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Runs `npm run build` (beforeBuildCommand) and then `cargo build --release`.
      # --no-bundle: only the exe, no NSIS/MSI installers.
      - name: Build markdown-viewer.exe
        run: npx tauri build --no-bundle

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXE="src-tauri/target/release/markdown-viewer.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::$EXE not found"
            ls -la src-tauri/target/release
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$EXE" --clobber
          else
            gh release create "$RELEASE_TAG" "$EXE" \
              --target "$GITHUB_SHA" \
              --title "Markdown Viewer $RELEASE_TAG" \
              --notes "Portable Windows build requires the Microsoft Edge WebView2 Runtime."
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
