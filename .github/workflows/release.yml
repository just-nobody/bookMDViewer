name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-portable' }}
          releaseName: "Markdown Viewer ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-portable' }}"
          releaseBody: "Standalone portable Windows executable."
          releaseDraft: false
          prerelease: false

      - name: Upload portable Windows exe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0-portable"
          fi
          
          VER="${TAG_NAME#v}"
          OUT="Markdown.Viewer_${VER}_x64_portable.exe"
          
          cp "src-tauri/target/release/md-viewer.exe" "$OUT"
          
          gh release upload "$TAG_NAME" "$OUT" --clobber
