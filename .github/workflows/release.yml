name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # Naudojame oficialų Tauri action kompilavimui
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Markdown Viewer ${{ github.ref_name }}"
          releaseBody: "Standalone portable Windows executable."
          releaseDraft: false
          prerelease: false

      # Atskiru žingsniu įkeliame TIK portable .exe failą
      - name: Upload portable Windows exe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="v1.0.0-portable"
          fi
          
          VER="${TAG_NAME#v}"
          OUT="Markdown.Viewer_${VER}_x64_portable.exe"
          
          # Kopijuojame gryną .exe failą
          cp "src-tauri/target/release/md-viewer.exe" "$OUT"
          
          # Įkeliame portable .exe į Release puslapį
          gh release upload "$TAG_NAME" "$OUT" --clobber
