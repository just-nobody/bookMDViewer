name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Create Release & Upload Portable EXE
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="v1.0.0-portable"
          fi
          
          VER="${TAG_NAME#v}"
          OUT="Markdown.Viewer_${VER}_x64_portable.exe"
          
          cp "src-tauri/target/release/md-viewer.exe" "$OUT"
          
          gh release create "$TAG_NAME" "$OUT" \
            --title "Markdown Viewer ${TAG_NAME}" \
            --notes "Standalone portable Windows executable." \
            --clobber
