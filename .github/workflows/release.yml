name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Leidžia paleisti kompilavimą rankiniu būdu per Actions kortelę

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Markdown Viewer ${{ github.ref_name }}"
          releaseBody: "Išversta lietuviška versija (Portable Windows)."
          releaseDraft: false
          prerelease: false

      - name: Upload portable Windows exe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          OUT="Markdown.Viewer_${VER}_x64_portable.exe"
          cp "src-tauri/target/release/md-viewer.exe" "$OUT"
          gh release upload "$GITHUB_REF_NAME" "$OUT" --clobber
